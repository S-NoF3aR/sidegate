# Not part of kustomization.yaml on purpose: create the secret out of band,
# e.g. with External Secrets, Sealed Secrets or:
#
#   kubectl -n sidegate create secret generic sidegate-secrets \
#     --from-literal=SIDEGATE_SESSION_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=SIDEGATE_OIDC_CLIENT_SECRET='<entra client secret>' \
#     --from-literal=SIDEGATE_DATABASE_URL='postgres://sidegate:<password>@<host>:5432/sidegate?sslmode=require'
apiVersion: v1
kind: Secret
metadata:
  name: sidegate-secrets
  namespace: sidegate
type: Opaque
stringData:
  SIDEGATE_SESSION_SECRET: change-me-at-least-32-characters-long
  SIDEGATE_OIDC_CLIENT_SECRET: change-me
  SIDEGATE_DATABASE_URL: postgres://sidegate:change-me@postgres.example.internal:5432/sidegate?sslmode=require
