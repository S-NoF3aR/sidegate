# Startup settings. Apps, access rules and group names live in the database
# and are managed in the admin UI at https://apps.example.com/admin.
# Secrets (session secret, client secret, database URL) come from the
# sidegate-secrets Secret as SIDEGATE_* variables.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sidegate-config
data:
  config.yaml: |
    publicURL: https://apps.example.com
    domain: apps.example.com

    session:
      lifetime: 12h

    oidc:
      issuer: https://login.microsoftonline.com/00000000-0000-0000-0000-000000000000/v2.0
      clientID: 11111111-1111-1111-1111-111111111111
      # offline_access makes Entra issue refresh tokens, which the proxy
      # uses to revalidate sessions (disabled users, group changes).
      scopes: [openid, profile, email, offline_access]
      refreshInterval: 5m
      logoutFromProvider: true

    # guacd Service for RDP and SSH in the browser (see guacd.yaml).
    guacd: guacd:4822

    # Entra group object IDs whose members may use the admin UI.
    admin:
      groups: [22222222-2222-2222-2222-222222222222]
