apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sidegate
resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml
  - hpa.yaml
  - guacd.yaml
  - httproute.yaml
  # Still on an Ingress controller? Swap httproute.yaml for:
  # - ingress.yaml
  # Optional, see the comments in each file:
  # - networkpolicy.yaml    # only the gateway and Prometheus may connect
  # - servicemonitor.yaml   # Prometheus Operator
# Session recording storage (a ReadWriteMany volume), see recordings/:
# components:
#   - recordings
images:
  - name: sidegate
    newName: ghcr.io/s-nof3ar/sidegate
    newTag: "0.1.0"
