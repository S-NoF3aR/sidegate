apiVersion: v1
kind: Service
metadata:
  name: sidegate
  labels: {app.kubernetes.io/name: sidegate}
spec:
  selector: {app.kubernetes.io/name: sidegate}
  ports:
    - {name: http, port: 80, targetPort: http}
    # Prometheus metrics (and health checks); reachable only inside the
    # cluster, see networkpolicy.yaml.
    - {name: metrics, port: 8081, targetPort: health}
